<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor</title>
<script>
/* Runs before any kernel file: catches missing files and script errors so the page never fails silently. */
window.__fpProblems = [];
window.__fpReport = function (msg) {
  window.__fpProblems.push(msg);
  var show = function () {
    var b = document.getElementById('fp-problems');
    if (!b) {
      b = document.createElement('div');
      b.id = 'fp-problems';
      b.style.cssText = 'position:sticky;top:0;z-index:10000;background:#fde8e6;color:#7a1a12;border-bottom:2px solid #b42318;padding:12px 16px;font:14px/1.45 var(--font-sans,system-ui,"Segoe UI",sans-serif);white-space:pre-wrap';
      document.body.prepend(b);
    }
    b.textContent = 'Problem found. This page will not work until it is fixed:\n- ' + window.__fpProblems.join('\n- ');
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
};
window.addEventListener('error', function (e) {
  var t = e.target;
  if (t && t.tagName === 'SCRIPT') window.__fpReport('Could not load ' + t.getAttribute('src') + '. Check the runtime folder in the data folder has finished syncing.');
  else if (e.message && e.message !== 'Script error.' && !/ResizeObserver loop/.test(e.message)) window.__fpReport(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ' line ' + e.lineno + ')' : ''));
}, true);
window.addEventListener('unhandledrejection', function (e) { window.__fpReport('Unhandled error: ' + (e.reason && e.reason.message || e.reason)); });
</script>
</head>
<body>
<!-- The editor: every definition in the library. runtime/editor.html?kind=structure&id=od-checks opens one directly.
     Written by the installer: it loads whichever release runs (releases.js) through boot.js. Don't edit. -->
<script>window.FP_PAGE = 'editor';</script>
<script src="releases.js"></script>
<script src="boot.js"></script>
<script>if (!window.__fpBootRetrying && window.FP && FP.editor) FP.editor.start();</script>
</body>
</html>
