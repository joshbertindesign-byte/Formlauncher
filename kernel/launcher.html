<!doctype html>

<script>try{if(localStorage.getItem('fp-theme')==='night')document.documentElement.setAttribute('data-theme','night')}catch(e){}</script><style>:root[data-theme="night"]{color-scheme:dark;background:#13171c}/* theme-exception: first paint, before the theme file loads */</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form</title>
<script>
/* Runs before any kernel file: catches missing files and script errors so the page never fails silently. */
window.__fpProblems = [];
window.__fpReport = function (msg) {
  window.__fpProblems.push(msg);
  var show = function () {
    var b = document.getElementById('fp-problems');
    if (!b) {
      b = document.createElement('div');
      b.id = 'fp-problems';
      b.style.cssText = 'position:sticky;top:0;z-index:10000;background:var(--s-red-94,#fde8e6);color:var(--t-red-27,#7a1a12);border-bottom:2px solid var(--l-red-40,#b42318);padding:12px 16px;font:14px/1.45 var(--font-sans,system-ui,"Segoe UI",sans-serif);white-space:pre-wrap'; /* theme-exception: the banner must show even when the theme did not load */
      document.body.prepend(b);
    }
    b.textContent = 'Problem found. This page will not work until it is fixed:\n- ' + window.__fpProblems.join('\n- ');
  };
  if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
};
window.addEventListener('error', function (e) {
  var t = e.target;
  if (t && t.tagName === 'SCRIPT') window.__fpReport('Could not load ' + t.getAttribute('src') + '. Check the file is in the same folder as launcher.html and named exactly that.');
  else if (e.message && e.message !== 'Script error.' && !/ResizeObserver loop/.test(e.message)) window.__fpReport(e.message + (e.filename ? ' (' + e.filename.split('/').pop() + ' line ' + e.lineno + ')' : ''));
}, true);
window.addEventListener('unhandledrejection', function (e) { window.__fpReport('Unhandled error: ' + (e.reason && e.reason.message || e.reason)); });
</script>
</head>
