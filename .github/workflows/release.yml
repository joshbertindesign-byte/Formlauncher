# A stable version is a tag: v0.60.0 (matching runtime/0.60.0/). Pushing the tag, or running this by hand, checks the
# release zip and publishes it (and, when present, the full first-install folder) on the GitHub Releases page. Work in progress (untagged commits,
# branches) publishes nothing.
#
# To use the download: save kernel-X.Y.Z.zip into the SharePoint data folder's updates/ folder (the OneDrive shortcut),
# then an admin installs it from the editor: Admin > Updates.
name: Publish release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.60.0 (the tag v0.60.0 is made if it is missing)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RUNTIME: Forms b/runtime
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Not a version: $V"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the release zip against the committed files
        id: zip
        run: |
          V="${{ steps.v.outputs.version }}"
          # The packaged release (dist/<version>/) when there is one, else the deployed test folder.
          if [ -d "dist/$V/runtime/$V" ]; then RT="dist/$V/runtime"; else RT="$RUNTIME"; fi
          ZIP=$(python3 .github/scripts/verify_release.py "$V" "$RT")
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"
          FOLDER="dist/FormPlatform-$V.zip"; [ -f "$FOLDER" ] && echo "folder=$FOLDER" >> "$GITHUB_OUTPUT" || true

      - name: Publish
        run: |
          V="${{ steps.v.outputs.version }}"; ZIP="${{ steps.zip.outputs.path }}"; FOLDER="${{ steps.zip.outputs.folder }}"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "$ZIP" $FOLDER --clobber
          else
            gh release create "v$V" "$ZIP" $FOLDER --target "${GITHUB_SHA}" --title "Form Platform $V" \
              --notes "First install: download FormPlatform-$V.zip and copy its contents into the shared folder (see READ ME FIRST.txt inside). Update a folder already in use: download kernel-$V.zip, save it in the folder's updates/ folder, then install it from the editor: Admin > Updates."
          fi
